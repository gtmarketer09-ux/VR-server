<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Video library — Video CMS</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="videos">
  <div class="shell">
    <aside class="sidebar" id="sidebar-mount"></aside>

    <main class="main">
      <div class="page-header">
        <h1>Video library</h1>
        <p>Every uploaded video, with its title, description, category and thumbnail — also available as raw JSON.</p>
      </div>

      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom: 6px;">
        <div class="view-toggle">
          <button type="button" id="tab-gallery" class="active">Gallery</button>
          <button type="button" id="tab-json">Raw JSON</button>
        </div>
        <select id="category-filter" style="width:auto; min-width:180px;">
          <option value="">All categories</option>
        </select>
      </div>

      <div id="gallery-view">
        <div id="video-grid" class="video-grid"></div>
        <div class="pagination" id="pagination"></div>
      </div>

      <div id="json-view" style="display:none;">
        <pre class="json-view" id="json-output">Loading…</pre>
      </div>
    </main>
  </div>

  <!-- Lightweight lightbox for actually playing a video without navigating away -->
  <div id="player-modal" style="display:none; position:fixed; inset:0; background:rgba(6,7,12,0.88); z-index:1000; align-items:center; justify-content:center; padding:30px;">
    <div style="width:100%; max-width:900px;">
      <div class="player-stage">
        <video id="player-video" controls playsinline style="width:100%; border-radius:10px; background:#000; display:block;"></video>
        <select id="player-quality" class="quality-select" title="Quality" disabled>
          <option value="-1">Auto</option>
        </select>
      </div>
      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin-top:14px;">
        <button id="player-close" class="btn btn-ghost">Close</button>
        <span id="player-info" class="hint-text" style="margin:0;"></span>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script src="/js/hlsPlayer.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/videos.js"></script>
</body>
</html>
