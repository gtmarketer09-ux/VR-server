<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Categories — Video CMS</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="categories">
  <div class="shell">
    <aside class="sidebar" id="sidebar-mount"></aside>

    <main class="main">
      <div class="page-header">
        <h1>Categories</h1>
        <p>Videos are organized under these when you upload them.</p>
      </div>

      <div class="panel" style="margin-bottom: 24px;">
        <form id="category-form" style="display:flex; gap:10px; align-items:flex-end;">
          <div class="field" style="flex:1; margin-bottom:0;">
            <label for="category-name">New category</label>
            <input type="text" id="category-name" placeholder="e.g. Skating, Travel, VR/360" required />
          </div>
          <button type="submit" class="btn btn-primary">Add category</button>
        </form>
        <div class="error-text" id="form-error"></div>
      </div>

      <div class="panel">
        <div id="category-list" class="chip-row">
          <span style="color: var(--text-muted); font-size: 13px;">Loading…</span>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/nav.js"></script>
  <script>
    const listEl = document.getElementById('category-list');
    const form = document.getElementById('category-form');
    const nameInput = document.getElementById('category-name');
    const formError = document.getElementById('form-error');

    async function loadCategories() {
      const res = await fetch('/api/categories');
      if (!res.ok) return;
      const categories = await res.json();

      if (categories.length === 0) {
        listEl.innerHTML = `<span style="color: var(--text-muted); font-size: 13px;">No categories yet — add your first one above.</span>`;
        return;
      }

      listEl.innerHTML = categories
        .map(
          (c) => `
        <div class="chip" data-id="${c.id}">
          <span>${escapeHtml(c.name)}</span>
          <span class="count">${c.video_count}</span>
          <button type="button" class="delete-btn" title="Delete category" data-id="${c.id}" data-name="${escapeHtml(c.name)}">×</button>
        </div>
      `
        )
        .join('');
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      formError.textContent = '';
      const name = nameInput.value.trim();
      if (!name) return;

      try {
        const res = await fetch('/api/categories', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Could not add category');
        nameInput.value = '';
        loadCategories();
      } catch (err) {
        formError.textContent = err.message;
      }
    });

    listEl.addEventListener('click', async (e) => {
      const btn = e.target.closest('.delete-btn');
      if (!btn) return;
      const ok = confirm(`Delete "${btn.dataset.name}"? Videos in it will become uncategorized, not deleted.`);
      if (!ok) return;

      await fetch(`/api/categories/${btn.dataset.id}`, { method: 'DELETE' });
      loadCategories();
    });

    loadCategories();
  </script>
</body>
</html>
